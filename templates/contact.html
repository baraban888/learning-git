<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Kontakt – Alex Bahatiuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header class="fade-in">
  <a href="/mypage/me" class="fa-solid fa-user"> O mnie</a>
  <a href="/mypage/contact" class="fa-solid fa-envelope"> Kontakt</a>
</header>

<main>
  <h1 class="fade-in">Napisz do mnie</h1>

  {# сообщение об успехе через flash() #}
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert success"><i class="fa-solid fa-circle-check"></i> {{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <form class="form-card" action="/mypage/contact" method="POST" novalidate>
    <div class="form-group">
      <label for="name"><i class="fa-solid fa-id-card"></i> Imię</label>
      <input id="name" name="name" type="text" placeholder="Twoje imię" required>
    </div>

    <div class="form-group">
      <label for="email"><i class="fa-solid fa-at"></i> E-mail</label>
      <input id="email" name="email" type="email" placeholder="twoj@email.com" required>
    </div>

    <div class="form-group">
      <label for="message"><i class="fa-solid fa-message"></i> Wiadomość</label>
      <textarea id="message" name="message" rows="5" placeholder="Treść wiadomości..." required></textarea>
    </div>

    <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Wyślij</button>
  </form>
</main>

<footer class="fade-in">
  <p>© 2025 Alex Bahatiuk</p>
  <div class="social">
    <a href="http://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
    <a href="http://linkedin.com" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
    <a href="http://github.com" target="_blank"><i class="fa-brands fa-github"></i></a>
  </div>
</footer>
</body>
</html>
