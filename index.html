<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator walut NBP</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .lang { display:flex; gap:6px; }
    .lang button { padding:6px 10px; border:1px solid #ddd; background:#fff; border-radius:8px; cursor:pointer; }
    .lang button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    label { display:block; margin: 12px 0 6px; font-weight: 600; }
    input, select { width: 100%; padding: 10px; font-size: 16px; border:1px solid #ccc; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { margin-top: 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    button.primary { padding: 10px 16px; border:0; border-radius: 10px; font-size:16px; cursor:pointer; background:#2563eb; color:#fff; }
    .muted { color:#555; font-size:14px; }
    .result { margin-top: 16px; font-size: 18px; font-weight: 700; }
    .error { color:#b91c1c; }
    #amount { max-width: 180px; display:inline-block; }
  </style>
</head>
<body>
  <div class="top">
    <h1 id="title">Kalkulator walut (NBP, tabela C)</h1>
    <div class="lang">
      <button type="button" id="btn-pl">PL</button>
      <button type="button" id="btn-ua">UA</button>
    </div>
  </div>

  <div class="card">
    <form id="fx-form">
      <label for="currency" id="lbl-currency">Waluta</label>
      <select id="currency" required></select>

      <div class="row">
        <div>
          <label for="amount" id="lbl-amount">Ilość waluty</label>
          <input type="number" id="amount" min="0" step="0.01" placeholder="Np. 100" required />
        </div>
        <div>
          <label id="lbl-operation">Operacja</label>
          <div style="display:flex; gap:12px; align-items:center; height: 42px;">
            <label><input type="radio" name="side" value="buy" checked> <span id="opt-buy">Kupić (PLN → waluta)</span></label>
            <label><input type="radio" name="side" value="sell"> <span id="opt-sell">Sprzedać (waluta → PLN)</span></label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="btn-calc">Przelicz</button>
        <span id="meta" class="muted"></span>
      </div>

      <div id="result" class="result"></div>
      <div id="error" class="error"></div>
    </form>
  </div>

  <script>
    // === i18n словарь ===
    const i18n = {
      pl: {
        title: "Kalkulator walut (NBP, tabela C)",
        currency: "Waluta",
        amount: "Ilość waluty",
        amountPh: "Np. 100",
        operation: "Operacja",
        buy: "Kupić (PLN → waluta)",
        sell: "Sprzedać (waluta → PLN)",
        calc: "Przelicz",
        date: d => `Data kursu: ${d}`,
        errAmount: "Wprowadź poprawną ilość.",
        errRate: "Nie znaleziono kursu dla wybranej waluty.",
        resBuy: (amt, code, pln) => `Koszt zakupu ${amt} ${code}: ${pln}`,
        resSell: (amt, code, pln) => `Kwota ze sprzedaży ${amt} ${code}: ${pln}`,
        option: (code, name) => `${code} — ${name}`
      },
      ua: {
        title: "Калькулятор валют (NBP, таблиця C)",
        currency: "Валюта",
        amount: "Кількість валюти",
        amountPh: "Напр., 100",
        operation: "Операція",
        buy: "Купити (PLN → валюта)",
        sell: "Продати (валюта → PLN)",
        calc: "Конвертувати",
        date: d => `Дата курсу: ${d}`,
        errAmount: "Введіть коректну кількість.",
        errRate: "Курс для вибраної валюти не знайдено.",
        resBuy: (amt, code, pln) => `Ціна покупки ${amt} ${code}: ${pln}`,
        resSell: (amt, code, pln) => `Виручка від продажу ${amt} ${code}: ${pln}`,
        option: (code, name) => `${code} — ${name}`
      }
    };

    // === состояние ===
    let lang = localStorage.getItem("fx-lang") || "pl";
    let rates = [];

    // элементы
    const els = {
      title: document.getElementById("title"),
      lblCurrency: document.getElementById("lbl-currency"),
      lblAmount: document.getElementById("lbl-amount"),
      lblOperation: document.getElementById("lbl-operation"),
      optBuy: document.getElementById("opt-buy"),
      optSell: document.getElementById("opt-sell"),
      btnCalc: document.getElementById("btn-calc"),
      meta: document.getElementById("meta"),
      result: document.getElementById("result"),
      error: document.getElementById("error"),
      amount: document.getElementById("amount"),
      currency: document.getElementById("currency"),
      btnPL: document.getElementById("btn-pl"),
      btnUA: document.getElementById("btn-ua"),
      form: document.getElementById("fx-form"),
    };

    function setLang(newLang) {
      lang = newLang;
      localStorage.setItem("fx-lang", lang);
      document.documentElement.lang = lang === "pl" ? "pl" : "uk";
      const t = i18n[lang];

      els.title.textContent = t.title;
      els.lblCurrency.textContent = t.currency;
      els.lblAmount.textContent = t.amount;
      els.amount.placeholder = t.amountPh;
      els.lblOperation.textContent = t.operation;
      els.optBuy.textContent = t.buy;
      els.optSell.textContent = t.sell;
      els.btnCalc.textContent = t.calc;

      // перерисовать option-ы с переводом названий
      if (rates.length) {
        els.currency.innerHTML = rates
          .map(r => `<option value="${r.code}">${t.option(r.code, r.currency)}</option>`)
          .join("");
      }

      // активные кнопки языка
      els.btnPL.classList.toggle("active", lang === "pl");
      els.btnUA.classList.toggle("active", lang === "ua");
    }

    els.btnPL.addEventListener("click", () => setLang("pl"));
    els.btnUA.addEventListener("click", () => setLang("ua"));

    // загрузка курсов
    const URL = "https://api.nbp.pl/api/exchangerates/tables/C?format=json";
    async function loadRates() {
      try {
        const res = await fetch(URL, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error(`NBP HTTP ${res.status}`);
        const data = await res.json();
        rates = data[0].rates;

        // применяем текущий язык к списку
        setLang(lang);
        els.meta.textContent = i18n[lang].date(data[0].effectiveDate);
      } catch (e) {
        els.error.textContent = lang === "pl"
          ? "Nie udało się pobrać kursów NBP. Spróbuj ponownie później."
          : "Не вдалося завантажити курси NBP. Спробуйте пізніше.";
        console.error(e);
      }
    }

    // расчет
    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      els.error.textContent = "";
      els.result.textContent = "";

      const amount = parseFloat(els.amount.value);
      const code = els.currency.value;
      const side = new FormData(els.form).get("side"); // buy/sell
      const t = i18n[lang];

      if (!code || isNaN(amount) || amount <= 0) {
        els.error.textContent = t.errAmount;
        return;
      }
      const r = rates.find(x => x.code === code);
      if (!r) { els.error.textContent = t.errRate; return; }

      const rate = side === "buy" ? r.ask : r.bid;
      const pln = amount * rate;
      const fmt = new Intl.NumberFormat(lang === "pl" ? "pl-PL" : "uk-UA",
                    { style: "currency", currency: "PLN" }).format(pln);

      els.result.textContent = side === "buy"
        ? t.resBuy(amount, code, fmt)
        : t.resSell(amount, code, fmt);
    });

    // старт
    setLang(lang);
    loadRates();
  </script>
</body>
</html>
